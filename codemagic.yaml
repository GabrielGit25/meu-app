workflows:
  android-release:
    name: Android Release
    max_build_duration: 30
    environment:
      flutter: stable
      groups: []
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing: {}
